name: Temporary FireRed VAD transfer

on:
  push:
    branches:
      - tmp-model-transfer-20260831

permissions:
  contents: read

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download FireRed multilingual VAD
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/vad-model
          curl -L --fail --retry 5 --retry-delay 3 --connect-timeout 30 \
            -o /tmp/vad-model/firered-vad.gguf \
            'https://huggingface.co/cstr/firered-vad-GGUF/resolve/main/firered-vad.gguf?download=true'
          test -s /tmp/vad-model/firered-vad.gguf
          sha256sum /tmp/vad-model/firered-vad.gguf | tee /tmp/vad-model/SHA256SUMS.txt
          ls -lh /tmp/vad-model
      - name: Upload VAD
        uses: actions/upload-artifact@v4
        with:
          name: firered-vad
          path: /tmp/vad-model/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
