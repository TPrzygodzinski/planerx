name: Temporary Polish ASR model transfer

on:
  push:
    branches:
      - tmp-model-transfer-20260831

permissions:
  contents: read

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download public Polish ASR model
        shell: bash
        run: |
          set -euo pipefail
          URL='https://huggingface.co/cstr/stt-pl-fastconformer-hybrid-ctc-large-GGUF/resolve/main/stt-pl-fastconformer-hybrid-ctc-large-q4_k.gguf?download=true'
          curl -L --fail --retry 5 --retry-delay 3 --connect-timeout 30 -o /tmp/stt-pl-fastconformer-hybrid-ctc-large-q4_k.gguf "$URL"
          test -s /tmp/stt-pl-fastconformer-hybrid-ctc-large-q4_k.gguf
          ls -lh /tmp/stt-pl-fastconformer-hybrid-ctc-large-q4_k.gguf
          sha256sum /tmp/stt-pl-fastconformer-hybrid-ctc-large-q4_k.gguf
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: polish-asr-model
          path: /tmp/stt-pl-fastconformer-hybrid-ctc-large-q4_k.gguf
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
